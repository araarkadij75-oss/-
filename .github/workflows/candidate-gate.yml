name: MASTER AI Candidate Gate

on:
  push:
    branches:
      - 'candidate/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-ai-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Static + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run gate:static
      - run: npm run test:unit

  firestore-rules:
    name: Firestore Rules matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - run: npm run test:rules
